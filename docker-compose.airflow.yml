x-airflow-common:
  &airflow-common

  build:
    context: .
    dockerfile: Dockerfile.airflow

  image: olist-airflow:3.3.2

  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Local development only:
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    AIRFLOW__API__SECRET_KEY: local-dev-secret
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-jwt-secret

    # Connection used by YOUR project scripts.
    # host.docker.internal -> your Mac -> port 5432 -> olist-postgres
    DATABASE_URL: postgresql+psycopg://olist_user:olist_password@host.docker.internal:5432/olist

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins

    # Entire project available inside Airflow
    - .:/opt/airflow/project


services:

  airflow-db:
    image: postgres:17
    container_name: airflow-db

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  airflow-init:
    <<: *airflow-common

    depends_on:
      airflow-db:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API__SECRET_KEY: local-dev-secret
      AIRFLOW__API_AUTH__JWT_SECRET: local-dev-jwt-secret
      DATABASE_URL: postgresql+psycopg://olist_user:olist_password@host.docker.internal:5432/olist
      _AIRFLOW_DB_MIGRATE: "true"

    command: version


  airflow-api-server:
    <<: *airflow-common

    container_name: airflow-api-server

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    command: api-server


  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: scheduler


  airflow-dag-processor:
    <<: *airflow-common

    container_name: airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: dag-processor


volumes:
  airflow_db_data: