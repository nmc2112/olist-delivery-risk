services:
  postgres:
    image: postgres:17
    container_name: olist-postgres

    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist_user
      POSTGRES_PASSWORD: olist_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_user -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: